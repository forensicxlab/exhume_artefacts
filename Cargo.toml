[package]
name = "exhume_artefacts"
version = "0.5.0"
edition = "2024"
rust-version = "1.92"
description = "Digital forensics artefact parser library and CLI for Exhume."
repository = "https://github.com/forensicxlab/exhume_artefacts"
documentation = "https://www.forensicxlab.com/docs/category/exhume---artefacts"
readme = "README.md"
authors = ["k1nd0ne"]
license = "GPL-3.0-only"
keywords = ["forensics", "dfir", "artefacts", "parsers", "exhume"]
include = ["Cargo.toml", "LICENSE", "README.md", "src/**/*.rs", "examples/**/*.rs"]

[dependencies]
anyhow = "1.0.100"
base64 = "0.22"
serde_json = "1.0.145"
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
evtx = "0.8.5"
goblin = "0.10"
md5 = "0.7"
sha2 = "0.10"
sha-1 = "0.10"
hex = "0.4"
libsqlite3-sys = "0.30.1"
plist = "1.7"
scroll = "0.12"
exhume_filesystem = "=0.7.0"
log = "0.4.25"
clap = { version = "4.5", features = ["cargo"] }
clap-num = "1.1.1"
env_logger = "0.11.6"
exhume_body = "=0.7.0"
tempfile = "3.26.0"
